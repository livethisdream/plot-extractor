[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plot-extractor"
version = "0.1.0"
description = "Offline extraction of plot data from vector PDF datasheets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
plot-extractor = "plot_extractor.cli:main"

[tool.setuptools.packages.find]
include = ["plot_extractor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
