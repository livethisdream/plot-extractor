name: Process datasheets

# Drop PDFs into unprocessed/ and push. This workflow extracts their plots into
# output/<datasheet>/, moves each PDF to processed/ (or failed/), and commits
# the results back to the same branch.
on:
  push:
    paths:
      - "unprocessed/**"
  workflow_dispatch:

# one run at a time so two pushes can't move the same files
concurrency:
  group: process-datasheets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    # To keep datasheets off GitHub's cloud machines (or to reach a local LLM),
    # register a self-hosted runner and use:  runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Any PDFs waiting?
        id: check
        run: |
          n=$(find unprocessed -type f -iname '*.pdf' | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "$n PDF(s) in unprocessed/"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.count != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.check.outputs.count != '0'
        run: pip install .

      - name: Extract plots
        if: steps.check.outputs.count != '0'
        # settings come from plot-extractor.env at the repo root (edit it from any browser)
        run: python -m plot_extractor.inbox --inbox unprocessed --processed processed --failed failed --out output

      - name: Commit results
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A unprocessed processed failed output
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Process datasheets (run ${{ github.run_number }})"
          # retry in case someone pushed meanwhile
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
